<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ / สมัครสมาชิก</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  :root{--paper:#FBF8F1;--navy:#1A6BA0;--sky:#2196C9;--gold:#D9A330;--ink:#1A3A52;--muted:rgba(26,58,82,0.55);--line:rgba(26,106,160,0.18);--green-go:#3F8557;--danger:#E04433;--card:rgba(255,255,255,0.95);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#81CFF0;}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px;-webkit-font-smoothing:antialiased;}
  .auth-card{background:var(--card);border-radius:18px;width:100%;max-width:380px;padding:28px 24px 24px;box-shadow:0 16px 40px rgba(0,40,80,0.25);}
  .auth-logo{text-align:center;margin-bottom:18px;}
  .auth-logo img{max-width:160px;width:60%;}
  .tab-switch{display:flex;background:rgba(26,106,160,0.08);border-radius:10px;padding:3px;margin-bottom:20px;}
  .tab-btn{flex:1;text-align:center;padding:9px 0;font-size:14px;font-weight:600;font-family:'Baloo 2',sans-serif;color:var(--muted);border-radius:8px;cursor:pointer;transition:all .2s ease;user-select:none;}
  .tab-btn.active{background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(26,106,160,0.35);}
  .field-group{margin-bottom:14px;}
  .field-label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;}
  .field-input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:'IBM Plex Sans Thai',sans-serif;background:#fff;color:var(--ink);transition:border-color .15s ease;}
  .field-input:focus{outline:none;border-color:var(--sky);}
  .submit-btn{width:100%;padding:13px 0;background:linear-gradient(135deg,var(--navy) 0%,#0E4C7A 100%);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Baloo 2',sans-serif;cursor:pointer;margin-top:6px;transition:opacity .2s ease,transform .1s ease;}
  .submit-btn:active{transform:scale(0.98);}
  .submit-btn:disabled{opacity:0.55;cursor:not-allowed;}
  .form-alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}
  .form-alert.show{display:block;}
  .form-alert.error{background:rgba(224,68,51,0.1);color:var(--danger);border:1px solid rgba(224,68,51,0.25);}
  .form-alert.success{background:rgba(63,133,87,0.1);color:var(--green-go);border:1px solid rgba(63,133,87,0.25);}
  .form-panel{display:none;}
  .form-panel.active{display:block;}
  .back-link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted);text-decoration:none;}
  .forgot-link{display:block;text-align:right;font-size:12.5px;color:var(--sky);text-decoration:none;margin:-6px 0 14px;}
  .field-with-toggle{position:relative;}
  .field-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:12.5px;color:var(--muted);user-select:none;background:none;border:none;font-family:'IBM Plex Sans Thai',sans-serif;padding:4px;}
  .strength-bar{height:4px;border-radius:2px;background:rgba(26,58,82,0.1);margin-top:6px;overflow:hidden;}
  .strength-bar-fill{height:100%;width:0%;border-radius:2px;transition:width .2s ease,background-color .2s ease;}
  .strength-label{font-size:11.5px;margin-top:4px;color:var(--muted);}
  .auth-card{background:rgba(255,255,255,0.88);border:1.5px solid rgba(255,255,255,0.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 32px rgba(0,40,80,0.18);}
  .tab-btn{transition:all .18s cubic-bezier(.32,.72,0,1);}
  .tab-btn:active{opacity:0.82;transform:scale(0.97);}
  .field-input{transition:border-color .15s,box-shadow .15s;}
  .field-input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(33,150,201,0.15);}
  .submit-btn{transition:opacity .18s,transform .12s cubic-bezier(.32,.72,0,1),box-shadow .18s;box-shadow:0 4px 14px rgba(26,106,160,0.28);}
  .submit-btn:active{transform:scale(0.97);opacity:0.88;box-shadow:0 2px 6px rgba(26,106,160,0.15);}
  .submit-btn:disabled{box-shadow:none;}

  /* ── Email Verify Screen ── */
  .verify-screen{display:none;text-align:center;padding:8px 0 4px;}
  .verify-screen.active{display:block;}
  .verify-icon{width:72px;height:72px;margin:0 auto 18px;background:linear-gradient(135deg,rgba(33,150,201,0.12) 0%,rgba(26,106,160,0.18) 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .verify-icon svg{width:34px;height:34px;stroke:var(--navy);}
  .verify-title{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:10px;}
  .verify-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:6px;}
  .verify-email-text{font-weight:700;color:var(--navy);word-break:break-all;}
  .verify-note{font-size:12px;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .resend-btn{background:none;border:none;color:var(--sky);font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;cursor:pointer;text-decoration:underline;padding:0;margin-top:4px;}
  .resend-btn:disabled{color:var(--muted);text-decoration:none;cursor:not-allowed;}
  .resend-countdown{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px;}
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo"><img id="siteLogo" src="../images/logo-main-service1.png" alt="Mayor Service"></div>
  <div class="tab-switch">
    <div class="tab-btn active" data-tab="login">เข้าสู่ระบบ</div>
    <div class="tab-btn" data-tab="register">สมัครสมาชิก</div>
  </div>
  <div class="form-alert" id="formAlert"></div>

  <!-- LOGIN -->
  <div class="form-panel active" id="loginPanel">
    <div class="field-group">
      <label class="field-label">อีเมล</label>
      <input type="email" class="field-input" id="loginEmail" placeholder="you@example.com">
    </div>
    <div class="field-group">
      <label class="field-label">รหัสผ่าน</label>
      <input type="password" class="field-input" id="loginPassword" placeholder="••••••••">
    </div>
    <a href="/pages/forgot-password.html" class="forgot-link">ลืมรหัสผ่าน?</a>
    <button class="submit-btn" id="loginBtn">เข้าสู่ระบบ</button>
  </div>

  <!-- REGISTER -->
  <div class="form-panel" id="registerPanel">
    <div class="field-group">
      <label class="field-label">อีเมล</label>
      <input type="email" class="field-input" id="regEmail" placeholder="you@example.com">
    </div>
    <div class="field-group">
      <label class="field-label">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
      <div class="field-with-toggle">
        <input type="password" class="field-input" id="regPassword" placeholder="••••••••">
        <button type="button" class="field-toggle" data-toggle-for="regPassword">แสดง</button>
      </div>
      <div class="strength-bar"><div class="strength-bar-fill" id="strengthBarFill"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>
    <div class="field-group">
      <label class="field-label">ยืนยันรหัสผ่าน</label>
      <div class="field-with-toggle">
        <input type="password" class="field-input" id="regPasswordConfirm" placeholder="••••••••">
        <button type="button" class="field-toggle" data-toggle-for="regPasswordConfirm">แสดง</button>
      </div>
    </div>
    <button class="submit-btn" id="registerBtn" disabled>สมัครสมาชิก</button>
  </div>

  <!-- VERIFY EMAIL SCREEN -->
  <div class="verify-screen" id="verifyScreen">
    <div class="verify-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="M2 7l10 7 10-7"/>
      </svg>
    </div>
    <div class="verify-title">ตรวจสอบอีเมลของคุณ</div>
    <div class="verify-desc">
      เราส่งลิงก์ยืนยันไปที่<br>
      <span class="verify-email-text" id="verifyEmailDisplay"></span>
    </div>
    <div class="verify-desc" style="margin-top:8px;">กรุณาคลิกลิงก์ในอีเมลเพื่อเปิดใช้งานบัญชีของคุณ</div>
    <div class="verify-note">
      ไม่เห็นอีเมล? ตรวจสอบโฟลเดอร์ Spam/Junk<br>
      หรือส่งลิงก์ใหม่ด้านล่าง
    </div>
    <div style="margin-top:10px;">
      <button class="resend-btn" id="resendBtn">ส่งอีเมลยืนยันอีกครั้ง</button>
      <div class="resend-countdown" id="resendCountdown"></div>
    </div>
  </div>

  <a href="/" class="back-link" id="backHomeLink">← กลับหน้าแรก</a>
</div>

<script type="module">
import { auth, settings } from '../js/api.js';

// โหลด logo จาก Website Settings ถ้าแอดมินตั้งค่าไว้ (ไม่งั้นใช้ path เดิมเป็น fallback)
settings.get().then(({ data }) => {
  if (data.logo_url) document.getElementById('siteLogo').src = data.logo_url;
}).catch(() => {});

// redirect ถ้า login แล้ว
auth.getSession().then(session => {
  if (session) window.location.href = '/pages/shop.html';
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + 'Panel').classList.add('active');
    hideAlert();
  });
});

const alertEl = document.getElementById('formAlert');
function showAlert(msg, type='error') { alertEl.textContent = msg; alertEl.className = `form-alert show ${type}`; }
function hideAlert() { alertEl.className = 'form-alert'; }

// แสดง/ซ่อนรหัสผ่าน
document.querySelectorAll('.field-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.toggleFor);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.textContent = isHidden ? 'ซ่อน' : 'แสดง';
  });
});

// ตรวจความแข็งแรงของรหัสผ่าน — กันรหัสอ่อนที่ผ่านแค่เงื่อนไขความยาว
// เช่น "11111111" หรือ "aaaaaaaa" ซึ่งยาว 8 ตัวแต่เดาง่ายมาก
function checkPasswordStrength(pw) {
  if (!pw) return { score: 0, label: '', color: 'transparent' };

  const isAllSameChar   = /^(.)\1+$/.test(pw);
  const isSequential    = /^(0123456789|1234567890|abcdefgh|password|12345678)/i.test(pw);
  const hasLower        = /[a-z]/.test(pw);
  const hasUpper        = /[A-Z]/.test(pw);
  const hasDigit        = /[0-9]/.test(pw);
  const hasSymbol       = /[^a-zA-Z0-9]/.test(pw);
  const variety         = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;

  if (pw.length < 8 || isAllSameChar || isSequential) {
    return { score: 1, label: 'รหัสผ่านอ่อนเกินไป', color: 'var(--danger)' };
  }
  if (variety <= 2) {
    return { score: 2, label: 'พอใช้ — ลองเพิ่มตัวเลขหรือสัญลักษณ์', color: 'var(--gold)' };
  }
  return { score: 3, label: 'รหัสผ่านแข็งแรงดี', color: 'var(--green-go)' };
}

function updateRegisterState() {
  const password = document.getElementById('regPassword').value;
  const confirm   = document.getElementById('regPasswordConfirm').value;
  const email     = document.getElementById('regEmail').value.trim();

  const strength = checkPasswordStrength(password);
  const fill  = document.getElementById('strengthBarFill');
  const label = document.getElementById('strengthLabel');
  fill.style.width = `${(strength.score / 3) * 100}%`;
  fill.style.backgroundColor = strength.color;
  label.textContent = strength.label;
  label.style.color = strength.color === 'transparent' ? 'var(--muted)' : strength.color;

  const isValid = email && strength.score >= 2 && password === confirm && confirm.length > 0;
  document.getElementById('registerBtn').disabled = !isValid;
}

['regEmail', 'regPassword', 'regPasswordConfirm'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateRegisterState);
});
document.getElementById('loginBtn').addEventListener('click', async () => {
  hideAlert();
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showAlert('กรุณากรอกข้อมูลให้ครบ');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    const { data } = await auth.login(email, password);
    showAlert('เข้าสู่ระบบสำเร็จ', 'success');
    // redirect ตาม role
    setTimeout(async () => {
      try {
        const profileRes = await fetch('/api/auth/profile', {
          headers: { Authorization: `Bearer ${data.session.access_token}` }
        });
        const profileJson = await profileRes.json();
        if (profileJson.data?.role === 'admin') {
          window.location.href = '/pages/admin/dashboard.html';
        } else {
          window.location.href = '/pages/shop.html';
        }
      } catch {
        window.location.href = '/pages/shop.html';
      }
    }, 400);
  } catch (e) {
    showAlert(e.message);
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
});

// ── Verify Email Screen ──
let pendingEmail = '';
let resendTimer = null;

function showVerifyScreen(email) {
  pendingEmail = email;
  // ซ่อน tab-switch และ panels ทั้งหมด
  document.querySelector('.tab-switch').style.display = 'none';
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  hideAlert();

  document.getElementById('verifyEmailDisplay').textContent = email;
  document.getElementById('verifyScreen').classList.add('active');
  startResendCooldown();
}

function startResendCooldown(seconds = 60) {
  const btn = document.getElementById('resendBtn');
  const countdown = document.getElementById('resendCountdown');
  btn.disabled = true;
  let remaining = seconds;
  countdown.textContent = `ส่งใหม่ได้ใน ${remaining} วินาที`;
  if (resendTimer) clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(resendTimer);
      btn.disabled = false;
      countdown.textContent = '';
    } else {
      countdown.textContent = `ส่งใหม่ได้ใน ${remaining} วินาที`;
    }
  }, 1000);
}

document.getElementById('resendBtn').addEventListener('click', async () => {
  if (!pendingEmail) return;
  const btn = document.getElementById('resendBtn');
  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';
  try {
    await auth.resendVerification(pendingEmail);
    btn.textContent = 'ส่งอีเมลยืนยันอีกครั้ง';
    document.getElementById('resendCountdown').textContent = '✓ ส่งแล้ว!';
    setTimeout(() => startResendCooldown(60), 1000);
  } catch (e) {
    btn.textContent = 'ส่งอีเมลยืนยันอีกครั้ง';
    btn.disabled = false;
    document.getElementById('resendCountdown').textContent = 'ส่งไม่สำเร็จ กรุณาลองใหม่';
  }
});

// REGISTER
document.getElementById('registerBtn').addEventListener('click', async () => {
  hideAlert();
  const email    = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm  = document.getElementById('regPasswordConfirm').value;
  if (!email || !password) return showAlert('กรุณากรอกข้อมูลให้ครบ');
  if (checkPasswordStrength(password).score < 2) return showAlert('รหัสผ่านอ่อนเกินไป กรุณาตั้งรหัสผ่านที่คาดเดายากขึ้น');
  if (password !== confirm)  return showAlert('รหัสผ่านไม่ตรงกัน');
  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'กำลังสมัคร...';
  try {
    await auth.register(email, password);
    btn.textContent = 'สมัครสมาชิก';
    showVerifyScreen(email);
  } catch (e) {
    showAlert(e.message);
    btn.disabled = false; btn.textContent = 'สมัครสมาชิก';
  }
});
</script>
</body>
</html>
